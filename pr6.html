<!DOCTYPE html>
<html>
<head>
<title>CSS Practical</title>
<style>
/* Tag selector */
h1 {
color: blue;
}
/* Class selector */
.para {
color: green;
background-color: lightyellow;
padding: 10px;
}
/* ID selector */
#special {
color: red;
background-color: lightblue;
margin: 20px;
padding: 15px;
}
</style>
</head>
<body>
<h1>Welcome to CSS</h1> <p class="para">This paragraph uses a class selector.</p>
<p id="special">This paragraph uses an ID selector.</p>
</body>
</html>
