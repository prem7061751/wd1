<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Registration form</title>
</head>
<body>
    <h2>Registration form</h2>
    <form action="/">

        <!--name-->
        <label for="username">Name:</label>
        <input 
        type="text"
        placeholder="enter your full name"
        id="username"
        name="username"
         required><br><br>   
         
         <!--email-->
        <label for="email">Email:</label>
        <input type="email"
         id="email"
          name="email" 
          required><br><br> 
          
          <!--password-->
        <label for="password">Password:</label>
        <input type="password"
         id="password"
         name="password
         required"><br><br> 
         
         <!--phone number-->
        <label for="phone">Phone number :</label>
        <input type="tel" id="phone" name="phone" required><br><br>

        <!--age-->
        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="0"><br><br>

        <!--gender-->
        <label for="gender">Gender:</label>
        <input type="radio" id="male" name="gender" value="male">
        <label for="male">Male</label>
        <input type="radio" id="female" name="gender" checked value="female">
        <label for="female">Female</label>
        <input type="radio" id="other" name="gender" value="other">
        <label for="other">Other</label><br><br>

        <!--dob-->
        <label for="dob">Date of Birth:</label>
        <input type="date"  name="dob"><br><br>

        <!--course-->
        <label for="course">Course:</label>
        <select id="course" name="course">
            <option value="Btech" selected>B.Tech</option>
            <option value="Mtech">M.Tech</option>
            <option value="diploma">Diploma</option>
        </select><br><br>
        
        <label for="address">Address:</label>
        <textarea name="address" rows="3" col="30"></textarea><br><br>

        <!--checkbox-->
        <label>Hobbies:</label><br/><br/>
        <input type="checkbox" name="hobbies" id="reading"
        value="reading"/>
        <label for="reading">Reading</label>
        <input
        type="checkbox"
        name="hobbies"
        id="dancing"
        value="dancing"
        checked
        />
        <label for="dancing">Dancing</label><br><br>
        <button type="submit">Submit</button>
        </form>
        </body>
        </html>
